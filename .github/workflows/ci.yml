name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check dist/ matches the source
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all dist)" ]; then
            git status --porcelain dist
            echo "dist/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
